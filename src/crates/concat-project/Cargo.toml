[package]
name = "concat-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The edit itself: the project document, its operations, and undo. The engine's ownership of the model."

[dependencies]
# The speed curve's arithmetic lives with the engine's time map.
concat-core.workspace = true
# The scene commands (`SetSceneCameraKey` and friends) read and write the
# project's top-level `scene` document field, which is a `concat-scene`
# scene; the model itself stays a raw value, so nothing here needs the
# crate's types except these arms. `concat-camera` comes with the pose
# those arms build, which `concat-scene` holds behind its own dependency
# without re-exporting.
concat-camera.workspace = true
concat-scene.workspace = true
# `rc`: timelines and clips sit behind Arc so an undo snapshot shares what
# a command did not touch; the document still reads and writes them plain.
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }

[features]
# A JSON Schema for every type a command carries, from the same doc
# comments, for a caller that hands the schema to an agent (concat-mcp).
# Off by default: the engine and the window do not need it.
schema = ["dep:schemars"]

[lints]
workspace = true
