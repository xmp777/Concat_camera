[package]
name = "concat-studio"
description = "Headless scene renderer for Concat_camera: 2D scene + virtual camera to MP4"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
concat-camera.workspace = true
concat-scene.workspace = true
concat-project.workspace = true
concat-export.workspace = true
concat-media.workspace = true
serde_json.workspace = true
# Shape layers materialize to PNGs with the same rasterizer the titles
# use; `png-format` is its fast-deflate PNG writer.
tiny-skia = { version = "0.12", features = ["png-format"] }

[dev-dependencies]
# The materialization tests read the PNGs back pixel by pixel.
image = { version = "0.25", default-features = false, features = ["png"] }